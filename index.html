<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>合成大大 - 自訂圖片版</title>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Matter.js Physics Engine CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <!-- FontAwesome Icons CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@500;700&display=swap');

    body {
      font-family: 'Fredoka', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f7f3e9; /* 溫馨米色背景 */
      touch-action: manipulation;
      user-select: none;
      -webkit-user-select: none;
      overflow: hidden;
    }

    .game-frame {
      box-shadow: 0 15px 30px -5px rgba(220, 38, 38, 0.2), 0 8px 10px -6px rgba(0, 0, 0, 0.05);
    }

    /* 隱藏原生檔案上傳輸入框 */
    .avatar-upload-input {
      display: none;
    }
  </style>
</head>
<body class="min-h-screen w-screen flex flex-col items-center justify-between p-2 sm:p-4 text-gray-800">

  <!-- 頁頭與控制項 -->
  <header class="w-full max-w-md flex flex-col items-center z-20">
    <div class="w-full flex justify-between items-center px-1 py-1 mb-1">
      <h1 class="text-2xl sm:text-3xl font-black text-red-600 tracking-wide drop-shadow-sm flex items-center gap-2">
        <span>合成大大</span>
      </h1>
      
      <div class="flex gap-2">
        <!-- 自訂圖片面板按鈕 -->
        <button id="openConfigBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-amber-600 hover:bg-amber-700 active:scale-95 text-white rounded-full text-xs sm:text-sm font-bold transition shadow-md">
          <i class="fas fa-cog"></i>
          <span>自訂圖片</span>
        </button>

        <!-- 音效開關按鈕 -->
        <button id="soundBtn" class="flex items-center space-x-1 px-3 py-1.5 bg-purple-600 hover:bg-purple-700 active:scale-95 text-white rounded-full text-xs sm:text-sm font-bold transition shadow-md">
          <i id="soundIcon" class="fas fa-volume-up"></i>
          <span id="soundText">音效開</span>
        </button>
      </div>
    </div>

    <!-- 計分板 -->
    <div class="w-full bg-amber-100/90 backdrop-blur border-2 border-amber-300 rounded-2xl px-5 py-2 flex justify-between items-center shadow-sm">
      <div class="flex items-baseline space-x-2">
        <span class="text-xs sm:text-sm text-amber-800 font-bold">得分：</span>
        <span id="scoreDisplay" class="text-2xl sm:text-3xl font-black text-amber-900">0</span>
      </div>
      <div class="text-xs text-amber-700 font-semibold">
        最高分：<span id="highScoreDisplay" class="font-bold text-amber-900">0</span>
      </div>
    </div>
  </header>

  <!-- 遊戲主要區域 -->
  <main class="relative w-full max-w-md flex-1 flex items-center justify-center my-2">
    <div id="gameContainer" class="relative w-full aspect-[2/3] max-h-[70vh] bg-[#fdfaf2] rounded-2xl border-4 border-red-500 overflow-hidden game-frame">
      
      <!-- 頂部警戒線 -->
      <div id="dangerLine" class="absolute left-0 w-full border-b-2 border-dashed border-red-500 z-10 opacity-80 pointer-events-none" style="top: 18%;">
        <span class="absolute right-2 -top-5 text-[10px] text-red-500 font-bold bg-amber-50/90 px-1 rounded shadow-sm">警戒線</span>
      </div>

      <!-- 下落預覽指引線 -->
      <div id="guideLine" class="absolute top-0 w-0.5 h-full border-l border-dashed border-red-400 z-10 pointer-events-none hidden"></div>

      <!-- 預覽球體 Indicator -->
      <div id="previewBall" class="absolute pointer-events-none z-20 transform -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-md flex items-center justify-center overflow-hidden transition-opacity bg-cover bg-center">
      </div>

      <!-- Matter.js Canvas 畫布容器 -->
      <div id="canvasHolder" class="w-full h-full"></div>

      <!-- 遊戲結束 Modal -->
      <div id="gameOverModal" class="absolute inset-0 bg-black/60 backdrop-blur-sm z-40 flex flex-col items-center justify-center p-6 text-white hidden">
        <div class="bg-amber-50 text-gray-800 rounded-3xl p-6 w-full max-w-xs text
