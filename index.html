      </div>

以下是該 HTML 檔案的主要結構與功能解析：

### 1. 頂部頁眉與計數器區域（Header & Scoreboard）
* **計分板（計分板）**：第 61–70 行包含分數與最高分顯示區[cite: 1]。
  * `scoreDisplay`：顯示當前得分[cite: 1]。
  * `highScoreDisplay`：顯示最高得分[cite: 1]。

### 2. 遊戲主畫面區域（Main Game Container）
* **容器（`gameContainer`）**：第 74–75 行，定義了一個相對定位、具備最大寬度與高度限制（`aspect-[2/3]` 比例）的遊戲框架區[cite: 1]。
* **警戒線（頂部警戒線）**：第 78–79 行的 `dangerLine`，設有虛線樣式，並標記有「警戒線」文字[cite: 1]。
* **下落位置指南針/導引線**：第 83 行的 `guideline`，是一條垂直的虛線，用於輔助玩家預覽物品下落軌跡[cite: 1]。
* **預覽球 Indicator**：第 86 行的 `previewBall`，顯示即將落下的物體/球體[cite: 1]。
* **物理引擎畫布（Matter.js canvas）**：第 90 行的 `canvasHolder`，用於掛載 Matter.js 物理引擎渲染的遊戲 Canvas 畫布[cite: 1]。

### 3. 遊戲結束彈窗（Modal）
* **`gameOverModal`**：第 93–94 行，預設為隱藏狀態（`hidden`），當遊戲結束時跳出顯示結果[cite: 1]。
